name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore src/NHibernate.AspNetCore.DataProtection/
      - name: Build
        run: dotnet build --no-restore -c Release src/NHibernate.AspNetCore.DataProtection/
